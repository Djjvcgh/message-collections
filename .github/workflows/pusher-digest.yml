name: digest-push

on:
  schedule:
    - cron: "23 1,13 * * *"   # UTC 01:23 / 13:23 = 北京 09:23 / 21:23；错峰避免调度延迟
  workflow_dispatch:
    inputs:
      slot:
        description: "槽位覆盖（如 test；留空自动 morning/evening）"
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: pusher
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Push daily digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m pusher.run digest --slot "${{ inputs.slot }}"
      - name: Commit state
        run: |
          git config user.name "pusher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "state unchanged"
          else
            git commit -m "state: digest $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
          fi
