name: instant-push

on:
  schedule:
    - cron: "13,43 * * * *"   # 每30分钟；避开整/半点，GitHub 高峰期整点任务会被大幅延迟
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pusher
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Push welfare hits
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m pusher.run instant
      - name: Commit state
        run: |
          git config user.name "pusher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "state unchanged"
          else
            git commit -m "state: instant $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
          fi
