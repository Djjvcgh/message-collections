# 福利词表：命中即触发即时推送（匹配时忽略空白与大小写）
# 约定：只收「可领取」的表述。裸词「免费」已移除——2026-10-03 实测含「免费」的
# 8 条里 7 条是误报（免费课、工具评测、Meta 免费开放代码），只有兑换券那条是真的。
welfare_keywords:
  - 免费额度
  - 限时免费
  - 永久免费
  - 免费领取
  - 免费获得
  - 免费申请
  - 免费申领
  - 免费试用
  - 免费体验
  - 免费使用
  - 免费送
  - 免费拿
  - 免费得
  - 免费发放
  - 0元领
  - 零元领
  - 白嫖
  - 白送
  - 赠送
  - 送token
  - 送额度
  - 送会员
  - 送一年
  - 送三个月
  - 福利
  - 优惠
  - 折扣
  - 半价
  - 学生
  - 教育优惠
  - 校园
  # 裸词「试用」已移除：实测「我试用了 Gemini 免费的新工具」这类评测文会被误判，
  # 只保留「免费试用 / 试用资格」这种明确可领的表述。
  # 同理移除裸词「credits」（实测命中「每月含 400 万 credits」的订阅介绍，不是福利），
  # 保留 free credits / 送额度 / 免费额度。
  - 领取
  - 补贴
  - 优惠码
  - 折扣码
  - 兑换码
  - 兑换券
  - 优惠券
  - 免费域名
  - 免费服务器
  - 免费主机
  - 免费小鸡
  - 免费vps
  - 免费证书
  - 免费ssl
  - 免费邮箱
  - 免费api
  - 开源版
  - 内测资格
  - 公测
  - free tier
  - free credits
  - free trial
  - free plan
  - free domain
  - free vps
  - free hosting
  - giveaway
  - promo code
  - discount
  - student
  - half price
  # 注意：coupon 已移除。2026-10-03 实测它在 Telegram 免费课频道里
  # 连续命中 20 条正文（每篇正文都带 coupon 促销话术），全是误报。

# 限时窗口型情报：必须同时满足「能领到东西」＋「有期限/数量限制」。
# 2026-10-03 收窄：原先的 涨价 / 即将收费 / 最后一天 / 即将结束 / 限时 / sign up
# 会把「Nvidia Shield TV 涨价 100 美元」「TechRadar 硬件预购」这类行业新闻捞进来，
# 那些不是读者能领的福利。实测两个 opportunity 命中全是这种噪音，故删除这些词。
opportunity_keywords:
  - 开放注册
  - 开放申请
  - 申请资格
  - 内测资格
  - 公测资格
  - 限量
  - 名额
  - 先到先得
  - 申领
  - 报名
  - 截止
  - 抽签
  - 配额
  - 邀请码
  - 注册即送
  - 新用户福利
  - limited spots
  - first come
  - registration open
  - early access
  - waitlist

# 排除词：标题/摘要命中即跳过（调优误报时改这里）
# 注意：这里拒绝的是「看起来很福利、实际是噪音」的条目。
# 已知调优结论：
#   - deal 独立成词会命中大量收购新闻（见 tests/test_filter.py），不要加回
#   - coupon 同理（免费课正文必带），已从词表删除
#   - discount / 免费 / free 这几个宽词的误报由「摘要门槛 120 字」兜底，
#     若观察期仍偏多，按实测报告逐个收紧
exclude_words:
  - 广告
  - 广告位
  - 推广
  - 返利
  - 邀请码互助
  - 每日签到
  - 签到领
  - 抽奖
  - 薅羊毛群
  - sponsored
  # 课程类：Udemy 等平台的长文促销，福利价值低且极易刷屏
  - udemy
  - 优惠券码
  - 课程优惠
