  - first come

# --- 排除词：标题/摘要命中即跳过 ---
# 已知调优结论：
#   - deal 独立成词会命中大量收购新闻（见 tests/test_filter.py），不要加回
#   - 这里只放「广告/刷屏」类噪音；「看着像福利其实是资讯」交给 weak_* + 否定语境
exclude_words:
  - 广告
  - 广告位
  - 推广
  - 返利
  - 邀请码互助
  - 每日签到
  - 签到领
  - 抽奖
  - 薅羊毛群
  - sponsored
  # 课程类：Udemy 等平台的长文促销，福利价值低且极易刷屏
  - udemy
  - 优惠券码
  - 课程优惠
