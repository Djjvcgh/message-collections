# 词表分两层：硬词命中即成立；宽词（weak_*）必须与「硬福利证据」共现才成立。
#
# 为什么分两层（2026-10-05 实测复盘）：线上 47.5 小时只推了 3 条，而 3 条全是噪音——
#   「Gemini 将结束 Flash 和 Pro 模型的免费使用」命中 免费使用（福利被取消，不是福利）
#   「我让AI教学生写前端——Web教育者的集体反思」命中 学生（行业资讯）
#   「优惠价出一个香港 CSL esim」命中 优惠（二手转卖）
# 这些词本身没错，错在「单独出现就算命中」。宽词放到 weak_* 后，
# 必须同时出现 折扣码/兑换券/免费领取/价格折扣/free credits 这类硬证据才放行。
#
# 匹配范围：标题(中/英) + 信号词 + 短摘要（≤120 字）。
# **弱词不匹配英文标题**：实测 title_en 里的 students 会把英文 AI 新闻整条捞进来。
# 判定前会先抹掉否定语境（将结束…免费 / 不再免费 / 开始收费 / 恢复原价）。

