# --- 宽词：单独出现不算福利，必须与硬证据共现；且不参与英文标题匹配 ---
weak_welfare_keywords:
  - 优惠
  - 折扣
  - 福利
  - 学生
  - 校园
  - 教育
  - 教育优惠
  - 学生优惠
  - 永久免费
  - 免费使用
  - 公测
  - 开源版
  - free plan
  - discount
  - student
  - campus
  - education
  # 注意：coupon 已整段移除（2026-10-03 实测它在 Telegram 免费课频道连续命中
  # 20 条正文，每篇正文都带 coupon 促销话术，全是误报）；
  # 裸词「免费」「试用」「credits」同样不在表内。

# --- 硬限时词：本身就是可报名/可注册的动作 ---
opportunity_keywords:
  - 开放注册
  - 开放申请
  - 开放名额
  - 注册即送
  - 新用户福利
  - 申领
  - 公测资格
  - 内测资格
  - registration open
  - early access
  - waitlist

# --- 宽限时词：需要可领取动作或窗口证据 ---
weak_opportunity_keywords:
  - 限时
  - 限量
  - 名额
  - 先到先得
  - 报名
  - 截止
  - 抽签
