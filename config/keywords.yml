# 排除词：标题/摘要命中即跳过（调优误报时改这里）
# 注意：这里拒绝的是「看起来很福利、实际是噪音」的条目。
# 已知调优结论：
#   - deal 独立成词会命中大量收购新闻（见 tests/test_filter.py），不要加回
#   - coupon 同理（免费课正文必带），已从词表删除
#   - discount / 免费 / free 这几个宽词的误报由「摘要门槛 120 字」兜底，
#     若观察期仍偏多，按实测报告逐个收紧
exclude_words:
  - 广告
  - 广告位
  - 推广
  - 返利
  - 邀请码互助
  - 每日签到
  - 签到领
  - 抽奖
  - 薅羊毛群
  - sponsored
  # 课程类：Udemy 等平台的长文促销，福利价值低且极易刷屏
  - udemy
  - 优惠券码
  - 课程优惠
