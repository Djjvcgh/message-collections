# 信源清单：所有渠道都在这里增删，代码不用改
#
# type 取值：
#   radar    —— AI News Radar 公开 JSON（radar 选项 url / max_age_hours / limit）
#   rss      —— RSS / Atom 订阅（rss 选项 url / name / text_fallback / max_age_days / limit）
#   telegram —— Telegram 公开频道网页预览（telegram 选项 channel / name / limit / proxy）
#
# enabled: false 的信源会被跳过，但保留在清单里方便回看与恢复。
# 新增信源的标准流程：先 python -m pusher.run --probe --only <id> 通过，再启用到正常轮次。
sources:
  # --- AI 资讯（原主源，现降为普通信源之一）---
  - id: radar
    type: radar
    options:
      url: https://news.learnprompt.pro/data/latest-24h.json
      max_age_hours: 36
      # 它的摘要常是整篇资讯正文，撞词极多（TechCrunch 门票、Meta 开源都会
      # 命中「免费/优惠」），所以只按标题判定；需要摘要兜底时改 true
      match_summary: false

  # --- 中文社区板块：白嫖服务器 / 免费域名 / 限时活动的主产地 ---
  # NodeSeek 实测以二手交易与闲聊为主（求推荐 VPS / 出机器 / 收机器），
  # 与「福利」目标不符，默认停用；需要时把 enabled 改回 true 并打开 require_actionable。
  - id: nodeseek
    type: rss
    enabled: false
    options:
      url: https://www.nodeseek.com/rss.xml
      name: NodeSeek
      require_actionable: true
      layout: facts_only
  - id: nodeseek-free
    type: rss
    enabled: false
    options:
      url: https://www.nodeseek.com/rss.xml?f=7
      name: NodeSeek 福利
      require_actionable: true
      layout: facts_only
  - id: v2ex-deals
    type: rss
    options:
      url: https://www.v2ex.com/feed/tab/deals.xml
      name: V2EX 优惠信息
      # 该版以二手交易/闲聊为主，实测 49 条里只有 9 条含明确优惠信息，
      # 打开后只放行带折扣码/兑换券/免费额度这类硬信息的帖子
      require_actionable: true
      # 帖子正文是一整段没有句末标点的流水账（还混着签名与网址），
      # 倒出来没法读也压不掉，改为只给抽出的硬信息
      layout: facts_only
  - id: 52pojie
    type: rss
    options:
      url: https://www.52pojie.cn/forum.php?mod=rss&fid=2
      name: 吾爱破解
  # 注：52pojie 的 freeshare 版（fid=7/26/40/52）实测 RSS 为空，不可用，
  # 已验证可用的版块是 fid=2/16/41/42（fid=2 即当前配置）。

  # 2026-10-05 修正：原来停用它是因为 `/feed/tab/free.xml` 返回 0 字节，
  # 但**节点** feed `/feed/free.xml` 是活的且质量最高——50 条里 31 条命中，
  # 全是「内网云兑换券」「送网易云会员」「招行福利两件套」这类真赠送帖。
  # 注意它是低频节点：近 7 天 2 条、近 30 天 16 条，所以 max_age_days 放到 7 天。
  - id: v2ex-free
    type: rss
    options:
      url: https://www.v2ex.com/feed/free.xml
      name: V2EX 免费赠送
      # 该节点也混着「求个会员」的索要帖与二手交易，只放行真能领到的
      require_actionable: true
      max_age_days: 7
  - id: hostloc
    type: rss
    enabled: false
    options:
      url: https://hostloc.com/forum.php?mod=rss&fid=45
      name: 全球主机交流
  # hnrss.org 在本机与 CI 均出现 SSL 断连（EOF in violation of protocol），
  # 且当日查询长期 0 命中，收益不足，停用。
  - id: hn-free-tier
    type: rss
    enabled: false
    options:
      url: https://hnrss.org/newest?q=free+tier
      name: HN free tier

  # --- Reddit 免费版块（多个板合并成一个 feed，一次请求）---
  # 2026-10-05 实测：25 条里 2 条真福利（iOS 应用终身赠送、每周免费有声书）。
  # 风险：Reddit 对同一出口有速率限制，连续请求会 429（实测第二次即被限流）；
  # 线上每轮只请求一次，通常可用，失败时按单源故障隔离跳过，不影响其他源。
  - id: reddit-freebies
    type: rss
    options:
      url: https://www.reddit.com/r/freebies+eFreebies+AppHookup+freegames+GameDealsFree+FreeGameFindings+FreeEBOOKS/.rss
      name: Reddit 免费版块
      # 免费赠送帖本身时效很短，超过 3 天的基本已领完
      max_age_days: 3

  # --- Telegram 公开频道：羊毛信息最快的一手来源 ---
  # 频道名必须在 CI/本地探测通过才算数（2026-10-03：yangmaoshe 为空壳，已删）
  - id: tg-freebies
    type: telegram
    options:
      channel: freebiesglobal
      name: Freebies Global
      limit: 20
  - id: tg-vpsfree
    type: telegram
    options:
      channel: vpsfree
      name: VPS Free
      limit: 20
  # 待探测的候选频道，通过后再删掉 enabled: false
  - id: tg-freebie
    type: telegram
    enabled: false
    options:
      channel: freebie
      name: Freebie
      limit: 20
  - id: tg-giveaway
    type: telegram
    enabled: false
    options:
      channel: giveaway
      name: Giveaway
      limit: 20
  - id: tg-freenet
    type: telegram
    enabled: false
    options:
      channel: freenet
      name: FreeNet
      limit: 20

  # --- 境外厂商 / 聚合站：免费额度、free tier、促销 ---
  - id: cloudflare-blog
    type: rss
    options:
      url: https://blog.cloudflare.com/rss/
      name: Cloudflare Blog
  - id: github-blog
    type: rss
    options:
      url: https://github.blog/feed/
      name: GitHub Blog
