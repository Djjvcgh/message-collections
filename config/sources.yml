# 信源清单：所有渠道都在这里增删，代码不用改
#
# type 取值：
#   radar    —— AI News Radar 公开 JSON（radar 选项 url / max_age_hours / limit）
#   rss      —— RSS / Atom 订阅（rss 选项 url / name / text_fallback / max_age_days / limit）
#   telegram —— Telegram 公开频道网页预览（telegram 选项 channel / name / limit / proxy）
#
# enabled: false 的信源会被跳过，但保留在清单里方便回看与恢复。
sources:
  # --- AI 资讯（原主源，现降为普通信源之一）---
  - id: radar
    type: radar
    options:
      url: https://news.learnprompt.pro/data/latest-24h.json
      max_age_hours: 36

  # --- 中文社区板块：白嫖服务器 / 免费域名 / 限时活动的主产地 ---
  # 注意：这几个站（尤其 linux.do）会对境外/受限网络重置连接，
  # 本地探测若整站不可达属正常现象，以 GitHub Actions 上的 --probe 结果为准。
  # 2026-10-03 本机实测：nodeseek 20 条可用；v2ex 优惠信息 39 条可用；
  # 52pojie 7 条可用；v2ex 免费赠送与 hostloc 返回空/HTML（待 Actions 复核）。
  - id: linuxdo-free
    type: rss
    options:
      url: https://linux.do/c/free-stuff/13.rss
      name: Linux.do 免费资源
      # Discourse 的 description 可能是纯文本正文，不做 HTML 反转义
      text_fallback: true
  - id: linuxdo-latest
    type: rss
    options:
      url: https://linux.do/latest.rss
      name: Linux.do 最新
      text_fallback: true
  - id: nodeseek
    type: rss
    options:
      url: https://www.nodeseek.com/rss.xml
      name: NodeSeek
  - id: v2ex-free
    type: rss
    options:
      url: https://www.v2ex.com/feed/tab/free.xml
      name: V2EX 免费赠送
  - id: v2ex-deals
    type: rss
    options:
      url: https://www.v2ex.com/feed/tab/deals.xml
      name: V2EX 优惠信息
  - id: hostloc
    type: rss
    options:
      url: https://hostloc.com/forum.php?mod=rss&fid=45
      name: 全球主机交流
  - id: 52pojie
    type: rss
    options:
      url: https://www.52pojie.cn/forum.php?mod=rss&fid=2
      name: 吾爱破解

  # --- Telegram 公开频道：羊毛信息最快的一手来源 ---
  # 频道名必须在本地/CI 探测通过才算数（2026-10-03 实测：yangmaoshe 为空壳，已删）
  - id: tg-freebies
    type: telegram
    options:
      channel: freebiesglobal
      name: Freebies Global
      limit: 20
  - id: tg-vpsfree
    type: telegram
    options:
      channel: vpsfree
      name: VPS Free
      limit: 20

  # --- 境外厂商 / 聚合站：免费额度、free tier、促销 ---
  - id: cloudflare-blog
    type: rss
    options:
      url: https://blog.cloudflare.com/rss/
      name: Cloudflare Blog
  - id: github-blog
    type: rss
    options:
      url: https://github.blog/feed/
      name: GitHub Blog
  - id: hn-free-tier
    type: rss
    options:
      url: https://hnrss.org/newest?q=free+tier
      name: HN free tier
