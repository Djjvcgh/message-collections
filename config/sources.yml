# 数据源配置
radar:
  # AI News Radar 公开数据（原 learnprompt.github.io 已 301 到此域名）
  latest_24h_url: https://news.learnprompt.pro/data/latest-24h.json
  # 数据年龄超过该小时数视为上游故障，本轮跳过
  max_age_hours: 36

# 页面 diff 监控（M2）：内容变化即推送；快照存 state/pages/（SHA 指纹 + 字符数）
# 首次运行只落基线不推送；抓取走 r.jina.ai（渲染 JS、输出稳定），失败回退直连
# 注意：内容含轮播/计数器的页面会持续误报（GitHub 学生包页实测抖动 20 字符，已移除）
page_watch:
  - name: deepseek-pricing
    url: https://api-docs.deepseek.com/quick_start/pricing
  - name: openai-pricing
    url: https://platform.openai.com/docs/pricing
  - name: bigmodel-pricing
    url: https://open.bigmodel.cn/pricing
  - name: zai-model-api
    url: https://z.ai/model-api
