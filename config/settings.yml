# 推送渠道开关与参数
channels:
  telegram:
    enabled: true
    link_preview: false   # 关闭链接预览大图，保持消息干净
    # 本地调试可设 TELEGRAM_PROXY 环境变量走代理，线上（Actions）直连
  wecom:
    enabled: false   # 预留渠道：配置 WEWORK_WEBHOOK_URL 后改为 true
  email:
    enabled: false   # 可选兜底：配置 SMTP_* 后改为 true

# 即时推送策略
push:
  # 单轮最多推送条数，避免多源聚合后刷屏；超出的条目下一轮继续（未记账不会丢）
  max_per_run: 8
  # 正文保障：渲染后除标题外没有任何内容可读的条目不推
  # （用户反馈「消息内容缺乏摘要，信息量太少」，宁可不推也不发空壳消息）
  require_body: true
  # 每轮最多为多少条补抓原文正文；只对将要推送的条目抓，开销是常数级
  max_enrich: 10

# 关键词匹配门槛（调参不必改代码）
filter:
  # 摘要超过这个长度视为整篇正文，不参与关键词匹配（实测 300→120 过滤掉大量正文撞词）
  max_reason_chars: 120

# 正文兜底抓取（源数据没有摘要时，从原文页取 og:description / 首段）
enrich:
  timeout: 8
