# 推送渠道开关与参数
channels:
  telegram:
    enabled: true
    # 本地调试可设 TELEGRAM_PROXY 环境变量走代理，线上（Actions）直连
  wecom:
    enabled: false   # 预留渠道：配置 WEWORK_WEBHOOK_URL 后改为 true
  email:
    enabled: false   # 可选兜底：配置 SMTP_* 后改为 true

# 日报各组条数上限
digest:
  limits:
    welfare: 10
    model_release: 6
    product: 4
    notable: 3
